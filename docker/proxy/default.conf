# Front door for production (docker-compose.prod.yml). Caddy terminates HTTPS
# and forwards here; everything goes to the app.
#
# The upstream is looked up through Docker's DNS on every request (variable in
# proxy_pass + short `valid`). During `docker rollout` the service name
# resolves to both the old and new container; if one refuses the connection,
# proxy_next_upstream retries the other, so clients see no errors.
resolver 127.0.0.11 valid=1s ipv6=off;

# Keep the scheme set by the TLS terminator in front of us, if any
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Matches post_max_size in docker/php.ini
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";

    # Only connection failures are retried, so a POST is never sent twice
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;

    location / {
        set $app http://app:80;
        proxy_pass $app;
        proxy_read_timeout 120s;
    }
}
