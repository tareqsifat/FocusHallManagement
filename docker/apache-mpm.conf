# Each PHP process can take tens of MB, and Apache's default allows 150 of
# them. Keep a small fixed pool; APACHE_MAX_WORKERS comes from the environment
# (default in the Dockerfile, 4 in docker-compose.prod.yml).
<IfModule mpm_prefork_module>
    StartServers            1
    MinSpareServers         1
    MaxSpareServers         2
    MaxRequestWorkers       ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild  1000
</IfModule>
