# Tests, then builds the app image on GitHub, pushes it to GHCR and rolls it
# out on the Droplet with no downtime.
#
# Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT (optional, default 22)
# Variables: DEPLOY_ENABLED=true to let pushes deploy (off until the server is ready)
#            APP_DIR (optional), default /opt/focushall

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the current one
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/focushall

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite
          coverage: none

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      # The layouts use @vite, so views need public/build/manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build

      - run: vendor/bin/pint --test

      # phpunit.xml already points tests at in-memory SQLite
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate before deploy: the image must run the patched PHP with every
      # extension the app needs, and Laravel must boot
      - name: Smoke test image
        run: |
          docker run --rm --entrypoint php "$IMAGE:${{ github.sha }}" -r '
            $min = "8.3.36";
            if (version_compare(PHP_VERSION, $min, "<")) { fwrite(STDERR, "PHP ".PHP_VERSION." < $min\n"); exit(1); }
            foreach (["pdo_mysql", "intl", "Zend OPcache"] as $ext) {
              if (!extension_loaded($ext)) { fwrite(STDERR, "missing extension: $ext\n"); exit(1); }
            }
            echo "PHP ".PHP_VERSION." OK\n";'
          docker run --rm --entrypoint php -e APP_KEY=base64:$(openssl rand -base64 32) \
            "$IMAGE:${{ github.sha }}" artisan --version

  deploy:
    needs: build
    # Off switch: set the repo variable DEPLOY_ENABLED=true to let pushes deploy
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ vars.APP_DIR || '/opt/focushall' }}"
            # Compose files, proxy config and scripts come from the same commit
            git fetch --quiet origin main
            git checkout --quiet --detach ${{ github.sha }}
            bash bin/release.sh ${{ github.sha }}
