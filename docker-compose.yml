# Local: builds the image from this folder and runs it with MySQL.
#
#   docker compose up -d --build     # http://localhost:8000, demo data seeded on first start
#   docker compose down -v           # stop and delete the database and uploads
#
# Values here are literals on purpose: compose reads the Laragon .env in this
# folder for ${...} interpolation, and those values (127.0.0.1, root, no
# password) must not leak in. Production overrides live in
# docker-compose.prod.yml and read the server's own .env.

name: focushall

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kjh_hall
      MYSQL_USER: hall
      MYSQL_PASSWORD: hall_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      # 3307 on the host so it does not clash with Laragon's MySQL
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    image: focushall:local
    build: .
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: KJH Hall
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000

      LOG_CHANNEL: stack
      LOG_STACK: single,stderr
      LOG_LEVEL: warning

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kjh_hall
      DB_USERNAME: hall
      DB_PASSWORD: hall_secret

      SESSION_DRIVER: database
      CACHE_STORE: database
      # Nothing is queued today; sync means no worker container is needed
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      MAIL_MAILER: log

      SEED_DEMO_DATA: "true"
    volumes:
      # Uploads (complaint photos, club logos, notice PDFs), logs and the
      # generated local APP_KEY
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  db_data:
  app_storage:
